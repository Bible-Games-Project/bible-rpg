name: Reply to comments on the shorts

# Every day at 19:00 Madrid in winter (18:00 UTC; 20:00 in summer), one hour
# after the shorts go out: answers the new comments (tools/shorts/reply-comments.mjs).
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'Only show the replies, send nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reply-comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      # the ids of the comments already answered, kept between runs
      - name: Restore answered comments
        uses: actions/cache/restore@v4
        with:
          path: tools/shorts/.replied.json
          key: replied-comments-${{ github.run_id }}
          restore-keys: replied-comments-

      - name: Reply
        env:
          UPLOAD_POST_BGP_API_KEY: ${{ secrets.UPLOAD_POST_BGP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/shorts/reply-comments.mjs ${{ inputs.dry && '--dry' || '' }}

      - name: Save answered comments
        if: always() && hashFiles('tools/shorts/.replied.json') != ''
        uses: actions/cache/save@v4
        with:
          path: tools/shorts/.replied.json
          key: replied-comments-${{ github.run_id }}
